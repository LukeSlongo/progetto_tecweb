<section class="auth-section">
    <div class="auth-wrapper">
        
        <div class="auth-theme-header">
            <button id="theme-toggle" class="btn-theme auth-theme-toggle" aria-label="Cambia tema chiaro/scuro">🌙</button>
        </div>

        <div class="auth-container">
            <h1 class="auth-title">Benvenuto su<br>UniFix</h1>

            <div class="error-message" role="alert">##FLASH_ERROR##</div>

            <form action="/register" method="POST" class="auth-form">

                <div class="form-group">
                    <label for="username">Nome utente</label>
                    <input type="text" id="username" name="username" required 
                           minlength="3"
                           maxlength="50"
                           aria-describedby="username-hint"
                           autocomplete="username">
                    <span id="username-hint" class="form-hint">Scegli un nome tra 3 e 50 caratteri.</span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required
                           minlength="8"
                           maxlength="50" 
                           aria-describedby="password-hint" 
                           autocomplete="new-password">
                    <span id="password-hint" class="form-hint">La password deve contenere almeno 8 caratteri.</span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Registrati</button>
                </div>

            </form>

            <div class="auth-footer">
                <p>Hai già un account? <a href="/login">Accedi qui</a></p>
            </div>
        </div>
    </div>
</section>
