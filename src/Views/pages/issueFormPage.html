<form action="##FORM_ACTION##" method="POST" class="report-form" id="issue-form">

    <fieldset class="form-gray-box">
        
        <h2>##FORM_LEGEND##</h2>

        <p class="mandatory-note">Tutti i campi indicati con un asterisco (<span aria-hidden="true">*</span>) sono obbligatori.</p>

        <div class="form-horizontal-group">
            <label for="building_id">edificio <span class="required-asterisk" aria-hidden="true">*</span></label>
            <select name="building_id" id="building_id" required>
                <option value="">Seleziona</option>
                ##BUILDING_OPTIONS##
            </select>
        </div>

        <div class="form-horizontal-group">
            <label for="room_id">nome aula <span class="required-asterisk" aria-hidden="true">*</span></label>
            <select name="room_id" id="room_id" required>
                <option value="">Seleziona</option>
                ##ROOM_OPTIONS##
            </select>
        </div>

        <div class="form-horizontal-group spacer-group">
            <label for="issue_title">titolo segnalazione <span class="required-asterisk" aria-hidden="true">*</span></label>
            <div class="input-wrapper">
                <input type="text" name="issue_title" id="issue_title" value="##ISSUE_TITLE_VALUE##" maxlength="150" required aria-describedby="title-hint">
                <span id="title-hint" class="form-hint">Massimo 150 caratteri.</span>
            </div>
        </div>

        <div class="form-horizontal-group align-top">
            <label for="issue_description">descrizione segnalazione <span class="required-asterisk" aria-hidden="true">*</span></label>
            <div class="input-wrapper">
                <textarea name="issue_description"
                          id="issue_description"
                          rows="5"
                          maxlength="1000"
                          required aria-describedby="desc-hint">##ISSUE_DESC_VALUE##</textarea>
                <span id="desc-hint" class="form-hint">Massimo 1000 caratteri. Specifica bene il problema.</span>
            </div>
        </div>

    </fieldset> <div class="submit-row">
        <button type="submit" class="btn-primary btn-invia">##SUBMIT_BUTTON_TEXT##</button>
    </div>

</form>
